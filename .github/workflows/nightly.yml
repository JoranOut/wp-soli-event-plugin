name: Nightly Release

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get current version and date
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          DATE=$(date +'%Y%m%d')
          NIGHTLY_VERSION="${CURRENT_VERSION}-nightly.${DATE}"
          echo "nightly_version=${NIGHTLY_VERSION}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Stamp nightly version
        env:
          V: ${{ steps.version.outputs.nightly_version }}
        run: |
          set -euo pipefail
          # publish.js zips what is on disk, so the nightly version has to be
          # written into the version locations *before* the build. Without this
          # the zip reports the stable version, no site can tell a nightly from
          # a stable install, and the updater's channel split cannot engage.
          # Working tree only - nothing is committed back to the repo.
          sed -i -E "s|^(  Version: ).*$|\1${V}|" soli-event-plugin.php
          sed -i -E "s|(SOLI_EVENT__PLUGIN_VERSION', \")[^\"]*(\")|\1${V}\2|" soli-event-plugin.php
          sed -i -E "s|(~Current Version:[[:space:]]*)[^~]*(~)|\1${V}\2|" README.md
          # package.json is excluded from the zip, but keep it consistent so a
          # later change to publish.js's ignore list cannot reintroduce a drift.
          node -e 'const f="package.json",p=require("./"+f);p.version=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")' "$V"

          # Fail loudly rather than shipping a mis-stamped zip.
          grep -qF -- "  Version: ${V}" soli-event-plugin.php \
            || { echo "::error::failed to stamp the plugin header version"; exit 1; }
          grep -qF -- "SOLI_EVENT__PLUGIN_VERSION', \"${V}\"" soli-event-plugin.php \
            || { echo "::error::failed to stamp SOLI_EVENT__PLUGIN_VERSION"; exit 1; }
          grep -qE -- "~Current Version:[[:space:]]*${V}~" README.md \
            || { echo "::error::failed to stamp the version into README.md"; exit 1; }
          test "$(node -p "require('./package.json').version")" = "$V"
          echo "Stamped $V into all version locations."

      - name: Stamp the supported WordPress range
        run: |
          set -euo pipefail
          # Both ends of the range come from what the e2e suite actually ran:
          # 'tested' from wordpress.org's current release, 'requires' from the
          # floor branch declared in package.json. test.yml runs a leg against
          # each and fails if wp-env installed anything else, so neither number
          # is a claim nobody checked.
          WP=$(curl -sf https://api.wordpress.org/core/version-check/1.7/ \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).offers[0].current))')
          FLOOR=$(node -p "require('./package.json').wordpress.requiresAtLeast")
          test -n "$WP" && test -n "$FLOOR"

          sed -i -E "s|('tested' => ')[^']*(')|\1${WP}\2|" soli-event-plugin.php
          sed -i -E "s|('requires' => ')[^']*(')|\1${FLOOR}\2|" soli-event-plugin.php

          for pair in "tested:${WP}" "requires:${FLOOR}"; do
            key="${pair%%:*}"; val="${pair#*:}"
            if ! grep -qF -- "'${key}' => '${val}'" soli-event-plugin.php; then
              echo "::error::failed to stamp '${key}' => '${val}'"
              exit 1
            fi
          done
          echo "Stamped supported WordPress range: ${FLOOR} to ${WP}."

      # publish.js excludes every block's src/, so the block bundles must be
      # built before the zip is created or the plugin ships without its JS.
      - name: Build blocks
        run: npm run build

      - name: Build package
        run: |
          # Skip the i18n build for nightly (it requires a running wp-env)
          node ./publish.js

      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get all releases with 'nightly' in the tag
          NIGHTLY_RELEASES=$(gh release list --json tagName --jq '.[] | select(.tagName | contains("nightly")) | .tagName')
          for tag in $NIGHTLY_RELEASES; do
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.nightly_version }}" \
            --title "Nightly Build ${{ steps.version.outputs.date }}" \
            --notes "Automated nightly build from main branch.

          **Version:** ${{ steps.version.outputs.nightly_version }}
          **Built from:** ${{ github.sha }}

          This is a pre-release build for testing purposes." \
            --prerelease \
            *.zip
